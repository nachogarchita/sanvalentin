<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nacho & Yani — San Valentín 💘</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#ff9a9e;
      --bg2:#fad0c4;
      --ink:#3b1d2a;
      --card: rgba(255,255,255,0.78);
      --shadow: 0 18px 55px rgba(0,0,0,0.16);
      --yes:#b30000;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      text-align:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow:hidden;
      color:var(--ink);
    }

    /* Falling hearts */
    .heart{
      position: fixed;
      top: -16px;
      pointer-events:none;
      animation: fall linear infinite;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,0.12));
      opacity: .8;
      will-change: transform;
    }
    @keyframes fall{
      to{ transform: translateY(110vh) rotate(360deg); }
    }

    .card{
      width:min(760px,92vw);
      padding:26px 18px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    /* Decorative corners */
    .corner{
      position:absolute;
      width: 180px;
      height: 180px;
      opacity: 0.55;
      pointer-events:none;
    }
    .corner.tl{ top:-70px; left:-70px; transform: rotate(10deg); }
    .corner.tr{ top:-70px; right:-70px; transform: rotate(80deg); }
    .corner.bl{ bottom:-80px; left:-80px; transform: rotate(-20deg); }
    .corner.br{ bottom:-80px; right:-80px; transform: rotate(140deg); }

    .names{
      font-family: "Great Vibes", cursive;
      font-weight: 400;
      font-size: clamp(38px, 5vw, 62px);
      margin: 0 0 6px;
      letter-spacing: 0.3px;
      position: relative;
      z-index: 2;
    }
    .subtitle{
      margin: 0 auto 14px;
      max-width: 600px;
      line-height: 1.45;
      opacity: 0.93;
      position: relative;
      z-index: 2;
    }

    .mini{
      margin: 10px auto 0;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      opacity:.95;
      position: relative;
      z-index: 2;
    }

    button{
      border: 1px solid rgba(0,0,0,0.12);
      padding: 12px 18px;
      border-radius: 999px;
      cursor:pointer;
      font-weight: 800;
      background: rgba(255,255,255,0.88);
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
      transition: transform .12s ease, box-shadow .2s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active{ transform: scale(.98); }

    /* Play area (NO moves only inside this box) */
    .play-area{
      position: relative;
      width: min(640px, 88vw);
      margin: 16px auto 0;
      height: 170px;
      border-radius: 20px;
      border: 1px dashed rgba(179,0,0,0.25);
      background: rgba(255,255,255,0.35);
      box-shadow: 0 14px 30px rgba(0,0,0,0.07);
      overflow: hidden;
      z-index: 2;
    }

    #yes{
      background: rgba(179,0,0,0.92);
      color: white;
      border-color: rgba(255,255,255,0.25);
      position:absolute;
      left: 40%;
      top: 62%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center;
    }

    #no{
      position:absolute;
      left: 60%;
      top: 62%;
      transform: translate(-50%, -50%);
    }

    .result{
      margin-top: 16px;
      font-family: "Great Vibes", cursive;
      font-size: clamp(30px, 4vw, 44px);
      min-height: 54px;
      position: relative;
      z-index: 2;
    }

    .hint{
      margin-top: 10px;
      opacity: 0.8;
      font-size: 13px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <!-- Decorative corner SVGs -->
    <svg class="corner tl" viewBox="0 0 200 200" fill="none" aria-hidden="true">
      <path d="M30 120 C60 60, 110 60, 140 110 C165 150, 130 180, 95 160 C70 145, 55 155, 40 170"
            stroke="rgba(179,0,0,0.45)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="62" cy="92" r="10" fill="rgba(255,0,90,0.22)"/>
      <circle cx="118" cy="108" r="8" fill="rgba(255,0,90,0.18)"/>
    </svg>

    <svg class="corner tr" viewBox="0 0 200 200" fill="none" aria-hidden="true">
      <path d="M30 120 C60 60, 110 60, 140 110 C165 150, 130 180, 95 160 C70 145, 55 155, 40 170"
            stroke="rgba(179,0,0,0.45)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="62" cy="92" r="10" fill="rgba(255,0,90,0.22)"/>
      <circle cx="118" cy="108" r="8" fill="rgba(255,0,90,0.18)"/>
    </svg>

    <svg class="corner bl" viewBox="0 0 200 200" fill="none" aria-hidden="true">
      <path d="M30 120 C60 60, 110 60, 140 110 C165 150, 130 180, 95 160 C70 145, 55 155, 40 170"
            stroke="rgba(179,0,0,0.45)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="62" cy="92" r="10" fill="rgba(255,0,90,0.22)"/>
      <circle cx="118" cy="108" r="8" fill="rgba(255,0,90,0.18)"/>
    </svg>

    <svg class="corner br" viewBox="0 0 200 200" fill="none" aria-hidden="true">
      <path d="M30 120 C60 60, 110 60, 140 110 C165 150, 130 180, 95 160 C70 145, 55 155, 40 170"
            stroke="rgba(179,0,0,0.45)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="62" cy="92" r="10" fill="rgba(255,0,90,0.22)"/>
      <circle cx="118" cy="108" r="8" fill="rgba(255,0,90,0.18)"/>
    </svg>

    <h1 class="names">Nacho &amp; Yani 💘</h1>
    <p class="subtitle">
      Te hice esta mini página porque me encantaría pasar este 14 con vos.
      querés ser mi San Valentín? 🌹✨
    </p>

    <div class="mini">
      <button id="musicBtn">🎵 Música: Off</button>
    </div>

    <div class="play-area" id="playArea" aria-label="Zona de botones">
      <button id="yes">Sí, obvio 💖</button>
      <button id="no">No 😢</button>
    </div>

    <div class="result" id="result"></div>

  </div>

<script>
  // Hearts
  for(let i=0;i<44;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.textContent = Math.random()<0.2 ? "💗" : "❤";
    h.style.left = (Math.random()*100)+"vw";
    h.style.fontSize = (14+Math.random()*22)+"px";
    h.style.animationDuration = (3+Math.random()*6)+"s";
    h.style.animationDelay = (-Math.random()*6)+"s";
    h.style.opacity = (0.35 + Math.random()*0.55).toFixed(2);
    document.body.appendChild(h);
  }

  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const result = document.getElementById("result");
  const playArea = document.getElementById("playArea");

  let noClicks = 0;
  let yesScale = 1;

  yes.addEventListener("click", () => {
    result.textContent = "Siiii Yani 💖 TE AMOOOO";
    confettiHearts();

    // opcional: deshabilitar NO después del sí
    no.disabled = true;
    no.style.opacity = 0.55;
    no.style.cursor = "not-allowed";
  });

  // Click en NO => agranda SI + mueve NO dentro del play-area
  no.addEventListener("click", () => {
    if(no.disabled) return;

    noClicks++;

    // 1) Grow YES
    yesScale = Math.min(1 + noClicks * 0.14, 2.3);
    yes.style.transform = `translate(-50%,-50%) scale(${yesScale})`;

    // 2) Move NO (inside the play area)
    moveNoInside();

    // Mensajitos
    if(noClicks === 2) result.textContent = "😓😭";
    if(noClicks === 5) result.textContent = "Dale Yani..";
    if(noClicks === 8) result.textContent = "Ya está enorme dale";
    if(noClicks >= 11) result.textContent = "tocá Sí 🙏💘";
  });

  function moveNoInside(){
    // Position NO relative to the play-area (so it stays inside the box)
    const area = playArea.getBoundingClientRect();
    const pad = 10;

    // max position so entire button remains visible
    const maxX = area.width - no.offsetWidth - pad;
    const maxY = area.height - no.offsetHeight - pad;

    // random point inside
    const x = pad + Math.random() * maxX;
    const y = pad + Math.random() * maxY;

    // place it (no translate now)
    no.style.left = x + "px";
    no.style.top  = y + "px";
    no.style.transform = "translate(0,0)";
  }

  // Music button: On + open Spotify
  const musicBtn = document.getElementById("musicBtn");
  const spotifyLink = "https://open.spotify.com/playlist/0bSORWrePZGQCIYfXT3VPc?si=dacddf2a9dbf43a4";

  musicBtn.addEventListener("click", () => {
    musicBtn.textContent = "🎵 Música: On";
    window.open(spotifyLink, "_blank", "noopener,noreferrer");
  });

  // Tiny heart-confetti
  function confettiHearts(){
    for(let i=0;i<20;i++){
      const s=document.createElement("div");
      s.className="heart";
      s.textContent = "💘";
      s.style.left = (50 + (Math.random()*40-20))+"vw";
      s.style.top = (40 + (Math.random()*20-10))+"vh";
      s.style.fontSize = (18+Math.random()*24)+"px";
      s.style.animationDuration = (1.6+Math.random()*1.2)+"s";
      s.style.opacity = "1";
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 2400);
    }
  }
</script>
</body>
</html>
